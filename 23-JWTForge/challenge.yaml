apiVersion: apps/v1
kind: Deployment
metadata:
  name: JWTForge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: JWTForge
  template:
    metadata:
      labels:
        app: JWTForge
    spec:
      containers:
        - name: webapp
          image: ""
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
