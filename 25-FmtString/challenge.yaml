apiVersion: apps/v1
kind: Deployment
metadata:
  name: FmtString
spec:
  replicas: 1
  selector:
    matchLabels:
      app: FmtString
  template:
    metadata:
      labels:
        app: FmtString
    spec:
      containers:
        - name: webapp
          image: ""
          ports:
            - containerPort: 1337
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
