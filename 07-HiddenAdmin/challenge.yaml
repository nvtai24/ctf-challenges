apiVersion: apps/v1
kind: Deployment
metadata:
  name: HiddenAdmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: HiddenAdmin
  template:
    metadata:
      labels:
        app: HiddenAdmin
    spec:
      containers:
        - name: webapp
          image: ""
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
